name: Seqlane conflict resolver

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to update
        required: true
        type: string
      resolution_strategy:
        description: Integrate the base branch by rebasing or merging
        required: true
        default: rebase
        type: choice
        options:
          - rebase
          - merge

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: seqlane-resolve-merge-conflicts-${{ inputs.pull_request_number }}
  cancel-in-progress: false

jobs:
  resolve-conflicts:
    name: Resolve pull request merge conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require the default branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from the repository default branch."
            exit 1
          fi

      - name: Inspect pull request for target checkout
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The pull request number must be a positive integer."
            exit 1
          fi
          response=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! jq --exit-status --arg repository "$GITHUB_REPOSITORY" '
            .state == "open" and
            .head.repo.full_name == $repository and
            (.head.sha | test("^[0-9a-fA-F]{40}$|^[0-9a-fA-F]{64}$"))
          ' <<<"$response" > /dev/null; then
            echo "::error::The pull request must be open and its head branch must be in this repository."
            exit 1
          fi
          echo "head_sha=$(jq --raw-output '.head.sha' <<<"$response")" >> "$GITHUB_OUTPUT"

      - name: Check out trusted Seqlane source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: seqlane-source
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: resolution-target
          persist-credentials: false
          ref: ${{ steps.pull-request.outputs.head_sha }}

      - name: Resolve merge conflicts
        uses: ./seqlane-source/actions/resolve-merge-conflicts
        with:
          pull-request-number: ${{ inputs.pull_request_number }}
          resolution-strategy: ${{ inputs.resolution_strategy }}
          source-directory: seqlane-source
          target-directory: resolution-target
          commit: true
          push: true
          max-attempts: "10"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
