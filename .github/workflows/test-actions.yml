name: Test actions

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-merge-conflicts:
    name: Resolve merge conflicts action
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck action
        run: pnpm exec nx run action-resolve-merge-conflicts:typecheck

      - name: Bundle action
        run: pnpm exec nx run action-resolve-merge-conflicts:build

      - name: Verify committed bundle
        run: git diff --exit-code -- actions/*/dist/

      - name: Run local action
        uses: ./actions/resolve-merge-conflicts
        continue-on-error: true
        with:
          pull-request-number: "1"
          commit: false
          push: false
