name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  unit-tests:
    name: Unit tests
    uses: ./.github/workflows/unit-tests.yml

  action-verification:
    name: Action verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck action
        run: pnpm exec nx run action-resolve-merge-conflicts:typecheck

      - name: Bundle action
        run: pnpm exec nx run action-resolve-merge-conflicts:build

      - name: Verify committed bundle
        run: git diff --exit-code -- actions/*/dist/

      - name: Run local action entrypoint smoke test
        uses: ./actions/resolve-merge-conflicts
        env:
          NODE_ENV: test
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          OPENAI_API_KEY: ""
        with:
          pull-request-number: "1"
          commit: false
          push: false
