# Temporary validation branch: isolate package growth from the existing ACP failure.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-growth:
    name: Hosted package-growth validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        env:
          NPM_CONFIG_AUDIT: "false"
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Audit the expanded production graph
        run: pnpm verify:runtime --source
      - name: Build production packages
        run: pnpm exec nx run-many -t build --output-style=static
      - name: Install and consume all release packages
        run: pnpm verify:installed
      - name: Audit built packages and archives
        run: pnpm verify:runtime --distributions
