name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  unit-tests:
    name: Unit tests
    needs: actionlint
    uses: ./.github/workflows/unit-tests.yml
    with:
      ripwire_relevant: ${{ needs.actionlint.outputs.ripwire_relevant }}

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  actionlint:
    name: Actionlint
    uses: ./.github/workflows/actionlint.yml

  merge-gate:
    name: Merge gate
    if: ${{ always() }}
    needs: [lint, unit-tests, build, actionlint]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI gates to pass
        if: >-
          ${{
            needs.lint.result != 'success' ||
            needs.unit-tests.result != 'success' ||
            needs.build.result != 'success' ||
            needs.actionlint.result != 'success'
          }}
        run: exit 1
