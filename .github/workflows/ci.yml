name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  unit-tests:
    name: Unit tests
    needs: actionlint
    uses: ./.github/workflows/unit-tests.yml
    with:
      ripwire_relevant: ${{ needs.actionlint.outputs.ripwire_relevant }}

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  actionlint:
    name: Actionlint
    uses: ./.github/workflows/actionlint.yml
