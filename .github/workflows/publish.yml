name: Release npm packages

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify packages
        run: |
          pnpm test:mapping
          pnpm test:tooling
          pnpm exec nx run-many -t lint,build,test --projects=tag:release:npm --output-style=static

      - name: Upload verified package builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-builds-${{ github.sha }}
          path: |
            apps/cli/dist
            libs/adapter/dist
            libs/codex/dist
            libs/core/dist
            libs/opencode/dist
            libs/protocol/dist
            libs/runtime/dist
            libs/tui/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm trusted publishing client
        run: npm install --global npm@11.13.0

      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download verified package builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-builds-${{ github.sha }}
          path: .

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release tag and GitHub release
        id: release
        run: |
          git_authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${git_authorization}"

          git fetch --tags --force origin
          git fetch --no-tags origin main
          git switch --force-create main "$GITHUB_SHA"

          existing_release_tag="$(git tag --points-at HEAD --list 'v*.*.*' --sort=-v:refname)"
          if [[ "$existing_release_tag" == *$'\n'* ]]; then
            echo "::error::The triggering commit has multiple release tags"
            exit 1
          fi

          previous_ref="$GITHUB_SHA"
          if [[ -n "$existing_release_tag" ]]; then
            previous_ref="${GITHUB_SHA}^"
          fi
          previous_release_tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' "$previous_ref" 2>/dev/null || true)"
          if [[ -z "$previous_release_tag" || "$previous_release_tag" == "v0.0.0" ]]; then
            first_release=true
          else
            first_release=false
          fi
          echo "first_release=$first_release" >> "$GITHUB_OUTPUT"

          if [[ -n "$existing_release_tag" ]]; then
            release_tag="$existing_release_tag"
            release_version="${release_tag#v}"
            pnpm exec nx release version "$release_version" \
              --stage-changes=false \
              --git-commit=false \
              --git-tag=false \
              --git-push=false

            if [[ -z "$previous_release_tag" ]]; then
              echo "::error::The release tag has no previous version tag"
              exit 1
            fi
            node scripts/recover-release.mjs \
              "$release_version" \
              "$previous_release_tag" \
              "$GITHUB_SHA"
            if gh release view "$release_tag" >/dev/null 2>&1; then
              gh release edit "$release_tag" --title "$release_tag" --notes-file CHANGELOG.md
            else
              gh release create "$release_tag" \
                --verify-tag \
                --title "$release_tag" \
                --notes-file CHANGELOG.md
            fi
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            current_main="$(git rev-parse origin/main)"
            if [[ "$current_main" != "$GITHUB_SHA" ]]; then
              echo "::error::main advanced to $current_main after this workflow started at $GITHUB_SHA"
              exit 1
            fi

            release_args=(--skip-publish)
            if [[ "$first_release" == "true" ]]; then
              release_args+=(--first-release)
            fi
            pnpm exec nx release "${release_args[@]}"

            if ! release_tag="$(git describe --tags --exact-match --match 'v*.*.*' HEAD 2>/dev/null)"; then
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

          release_notes="$(gh release view "$release_tag" --json body --jq .body)"
          summary_limit=500000
          if (( ${#release_notes} > summary_limit )); then
            release_notes="${release_notes:0:summary_limit}"$'\n\n_Release notes truncated. Open the GitHub Release for the complete changelog._'
          fi
          {
            echo "# Release ${release_tag}"
            echo
            printf '%s\n' "$release_notes"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}

      - name: Verify release packages
        if: steps.release.outputs.released == 'true'
        run: node scripts/verify-release-packages.mjs

      - name: Publish release packages
        if: steps.release.outputs.released == 'true'
        run: |
          publish_args=(--access public --outputStyle=static)
          if [[ "${{ steps.release.outputs.first_release }}" == "true" ]]; then
            publish_args+=(--first-release)
          fi
          pnpm exec nx release publish "${publish_args[@]}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NX_DRY_RUN: "false"
