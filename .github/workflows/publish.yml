name: Publish npm packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm trusted publishing client
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          while IFS= read -r project; do
            project_root="$(pnpm exec nx show project "$project" --json | jq -r '.root')"
            package_version="$(jq -r '.version' "$project_root/package.json")"
            if [[ "$package_version" != "$expected_version" ]]; then
              echo "::error::$project has version $package_version; expected $expected_version"
              exit 1
            fi
          done < <(pnpm exec nx show projects --projects=tag:release:npm)

      - name: Verify packages
        run: |
          pnpm test:mapping
          pnpm test:tooling
          pnpm exec nx run-many -t lint,build,test --projects=tag:release:npm --output-style=static

      - name: Publish packages
        run: pnpm exec nx release publish --access public --output-style=static
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
