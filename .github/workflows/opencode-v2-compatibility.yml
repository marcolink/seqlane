name: OpenCode V2 compatibility

on:
  pull_request:
    paths:
      - "libs/opencode/**"
      - "apps/cli/**"
      - "libs/runtime/**"
      - "libs/adapter/**"
      - "scripts/opencode-v2*compatibility.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/opencode-v2-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "libs/opencode/**"
      - "apps/cli/**"
      - "libs/runtime/**"
      - "libs/adapter/**"
      - "scripts/opencode-v2*compatibility.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/opencode-v2-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --build apps/cli/tsconfig.json
      - name: Install pinned native server in a disposable prefix
        run: npm install --prefix "$RUNNER_TEMP/opencode-v2" --no-save @opencode/cli@2.1.2
      - name: Check compiled CLI and native session lifecycle
        env:
          SEQLANE_OPENCODE_V2_EXECUTABLE: ${{ runner.temp }}/opencode-v2/node_modules/.bin/opencode
        run: node scripts/opencode-v2-compatibility.mjs
      - name: Check native checkpoint and fork behavior
        env:
          SEQLANE_OPENCODE_V2_EXECUTABLE: ${{ runner.temp }}/opencode-v2/node_modules/.bin/opencode
        run: node scripts/opencode-v2-sessions-compatibility.mjs
      - name: Check native questions and cancellation
        env:
          SEQLANE_OPENCODE_V2_EXECUTABLE: ${{ runner.temp }}/opencode-v2/node_modules/.bin/opencode
        run: node scripts/opencode-v2-questions-compatibility.mjs
      - name: Check native live activity and recovery
        env:
          SEQLANE_OPENCODE_V2_EXECUTABLE: ${{ runner.temp }}/opencode-v2/node_modules/.bin/opencode
        run: node scripts/opencode-v2-events-compatibility.mjs
