name: Action bundle drift

on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  bundle-drift:
    name: Action bundle drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine affected range
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check whether Action inputs changed
        run: |
          if git diff --quiet "$NX_BASE" "$NX_HEAD" -- actions libs package.json pnpm-lock.yaml nx.json tsconfig.json tsconfig.spec.json; then
            echo "No generated Action bundle inputs changed; bundle-drift check passed."
            exit 0
          fi

      - name: Rebuild all Action bundles
        run: >-
          pnpm exec nx run-many -t build
          --projects=action-code-review,action-opencode-server,action-resolve-merge-conflicts,action-ripwire-server,action-setup-opencode,action-zvec-grep-server
          --output-style=static

      - name: Verify committed Action bundles
        run: |
          if git diff --quiet -- 'actions/*/dist/**'; then
            echo "Committed Action bundles match their sources."
            exit 0
          fi

          echo "Generated Action bundles are stale:" >&2
          git diff --name-only -- 'actions/*/dist/**' >&2
          exit 1
