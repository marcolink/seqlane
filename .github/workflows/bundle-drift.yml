name: Action bundle drift

on:
  workflow_call:
    inputs:
      bundle_relevant:
        description: Whether full Action bundle verification is relevant.
        required: false
        default: "true"
        type: string
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  bundle-drift:
    name: Action bundle drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify committed Action bundles
        run: node scripts/action-bundle-verifier.mjs --verify

      - name: Set up pnpm
        if: inputs.bundle_relevant != 'false'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        if: inputs.bundle_relevant != 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: inputs.bundle_relevant != 'false'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Compare all Action bundles with fresh Nx builds
        if: inputs.bundle_relevant != 'false'
        run: node scripts/action-bundle-verifier.mjs --drift

      - name: Verify all committed Action bundles
        if: inputs.bundle_relevant != 'false'
        run: node scripts/action-bundle-verifier.mjs --verify
