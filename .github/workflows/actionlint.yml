name: Actionlint

on:
  workflow_call:
    outputs:
      bundle_relevant:
        description: Whether full Action bundle verification is relevant.
        value: ${{ jobs.actionlint.outputs.bundle_relevant }}
      ripwire_relevant:
        description: Whether the Ripwire smoke test is relevant.
        value: ${{ jobs.actionlint.outputs.ripwire_relevant }}
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  actionlint:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bundle_relevant: ${{ steps.classify.outputs.bundle_relevant }}
      ripwire_relevant: ${{ steps.classify.outputs.ripwire_relevant }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@5ed673bc77a975c2402fdcd464706912c56b103b # v2
        with:
          version: 1.7.12
          cache: false
          shellcheck: false
          pyflakes: false

      - name: Determine affected range
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Classify changed paths
        id: classify
        run: node scripts/classify-ci-paths.mjs --base "$NX_BASE" --head "$NX_HEAD" >> "$GITHUB_OUTPUT"
