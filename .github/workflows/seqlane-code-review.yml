name: Seqlane code review

on:
  # Normal pull-request and comment events use the trusted workflow definition
  # from the repository's base/default branch (main for this project). Keep
  # branch-specific execution explicit through workflow_dispatch below.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
  issue_comment:
    types:
      - created
      - edited
  workflow_dispatch:
    # To test this workflow from a PR branch, dispatch it with:
    # gh workflow run "Seqlane code review" --ref <branch> -f pull_request_number=<number>
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: read

jobs:
  admit-review:
    name: Admit review request
    # GitHub evaluates job conditions before assigning a runner. Keep ordinary
    # issue comments from consuming a runner; the step below retains the exact
    # command grammar because expressions do not support the required regex.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       (github.event.action == 'created' || github.event.action == 'edited') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (contains(github.event.comment.body, '/seqlane') ||
        contains(github.event.changes.body.from, '/seqlane')))
    permissions:
      contents: none
      issues: none
      pull-requests: none
    outputs:
      eligible: ${{ steps.admission.outputs.eligible }}
      pull_request_number: ${{ steps.admission.outputs.pull_request_number }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate review admission
        id: admission
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pull_request_number }}
          EVENT_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PREVIOUS_COMMENT_BODY: ${{ github.event.changes.body.from }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            if [ "$EVENT_ACTION" != "closed" ] &&
               [ "$EVENT_DRAFT" = "false" ] &&
               [ "$EVENT_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              echo "pull_request_number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
            else
              echo "eligible=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$EVENT_PR_NUMBER" != "" ]; then
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              echo "pull_request_number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
            else
              echo "eligible=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "$EVENT_NAME" != "issue_comment" ] ||
             [ "$ISSUE_IS_PULL_REQUEST" != "true" ] ||
             { [ "$EVENT_ACTION" != "created" ] && [ "$EVENT_ACTION" != "edited" ]; } ||
             { [ "$COMMENT_AUTHOR_ASSOCIATION" != "OWNER" ] &&
               [ "$COMMENT_AUTHOR_ASSOCIATION" != "MEMBER" ] &&
               [ "$COMMENT_AUTHOR_ASSOCIATION" != "COLLABORATOR" ]; }; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n%s\n' "$COMMENT_BODY" "$PREVIOUS_COMMENT_BODY" | grep -Eqi '(^|[[:space:]])/seqlane[[:space:]]+(review([[:space:]]|$)|(fixed|wont-fix|downgrade)[[:space:]]+(F-[A-Za-z0-9][A-Za-z0-9_-]{0,63}|SEQ-PR[1-9][0-9]*-[0-9]{3,})([[:space:]]|$))' ; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "pull_request_number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

  code-review:
    name: Review pull request
    needs: admit-review
    if: needs.admit-review.outputs.eligible == 'true'
    permissions:
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: seqlane-code-review-${{ needs.admit-review.outputs.pull_request_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Report workflow definition revision
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          echo "Workflow definition: $WORKFLOW_REF"
          echo "Workflow definition SHA: $WORKFLOW_SHA"
          {
            echo "### Workflow definition"
            echo
            echo "- Ref: \`$WORKFLOW_REF\`"
            echo "- SHA: \`$WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check OpenAI credentials
        id: configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Seqlane code review because OPENAI_API_KEY is not configured."
          else
            echo "execute=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve pull request metadata
        if: steps.configuration.outputs.execute == 'true'
        id: pull-request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pull_request_number }}
          EVENT_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_STATE: ${{ github.event.pull_request.state }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$EVENT_PR_NUMBER" \
              > "$RUNNER_TEMP/seqlane-pull-request.json"
            BASE_BRANCH=$(jq --raw-output '.base.ref' "$RUNNER_TEMP/seqlane-pull-request.json")
            BASE_REVISION=$(jq --raw-output '.base.sha' "$RUNNER_TEMP/seqlane-pull-request.json")
            HEAD_REVISION=$(jq --raw-output '.head.sha' "$RUNNER_TEMP/seqlane-pull-request.json")
            HEAD_REPOSITORY=$(jq --raw-output '.head.repo.full_name' "$RUNNER_TEMP/seqlane-pull-request.json")
            DRAFT=$(jq --raw-output '.draft' "$RUNNER_TEMP/seqlane-pull-request.json")
            STATE=$(jq --raw-output '.state' "$RUNNER_TEMP/seqlane-pull-request.json")
          else
            BASE_BRANCH="$EVENT_BASE_BRANCH"
            BASE_REVISION="$EVENT_BASE_REVISION"
            HEAD_REVISION="$EVENT_HEAD_REVISION"
            HEAD_REPOSITORY="$EVENT_HEAD_REPOSITORY"
            DRAFT="$EVENT_DRAFT"
            STATE="$EVENT_STATE"
          fi

          if [ "$EVENT_NAME" = "issue_comment" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            jq '{number, title: (.title // ""), description: (.body // "")}' \
              "$RUNNER_TEMP/seqlane-pull-request.json" \
              > "$RUNNER_TEMP/seqlane-pull-request-context.json"
          else
            jq '{number: .pull_request.number, title: (.pull_request.title // ""), description: (.pull_request.body // "")}' \
              "$GITHUB_EVENT_PATH" \
              > "$RUNNER_TEMP/seqlane-pull-request-context.json"
          fi

          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ "$DRAFT" = "true" ] || [ "$STATE" != "open" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_revision=$BASE_REVISION" >> "$GITHUB_OUTPUT"
          echo "head_revision=$HEAD_REVISION" >> "$GITHUB_OUTPUT"

      - name: Check out Seqlane source
        if: steps.pull-request.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: seqlane-source
          persist-credentials: false
          # Build and run Seqlane from the immutable revision of this workflow.
          # pull_request_target and issue_comment can otherwise select an older
          # PR base whose CLI does not support the workflow's current flags.
          # To temporarily test a workflow change from a PR branch, dispatch
          # it explicitly from that branch with the command shown above.
          ref: ${{ github.workflow_sha }}

      - name: Check out pull request head
        if: steps.pull-request.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: review-target
          persist-credentials: false
          ref: ${{ steps.pull-request.outputs.head_revision }}

      - name: Set up pnpm
        if: steps.pull-request.outputs.eligible == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node.js
        if: steps.pull-request.outputs.eligible == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: seqlane-source/pnpm-lock.yaml

      - name: Start zvec-grep
        if: steps.pull-request.outputs.eligible == 'true'
        id: zvec-grep
        timeout-minutes: 10
        uses: ./seqlane-source/actions/zvec-grep-server
        with:
          working-directory: ${{ github.workspace }}/review-target

      - name: Start Ripwire
        if: steps.pull-request.outputs.eligible == 'true'
        id: ripwire
        timeout-minutes: 10
        uses: ./seqlane-source/actions/ripwire-server
        with:
          working-directory: ${{ github.workspace }}/review-target
          version: "0.4.0"
          listen: 127.0.0.1:7998
          top-k: "200"
          stable-order: "true"
          redact: "true"
          allow-remote-edits: "false"
          startup-timeout-seconds: "30"

      - name: Resolve OpenCode version
        if: steps.pull-request.outputs.eligible == 'true'
        id: opencode-version
        working-directory: seqlane-source
        env:
          OPENCODE_VERSION: 1.18.27
        run: |
          SDK_VERSION=$(node -p "require('./libs/seqlane-opencode/package.json').dependencies['@opencode-ai/sdk']")
          if [ "$SDK_VERSION" != "$OPENCODE_VERSION" ]; then
            echo "::error::OpenCode CLI $OPENCODE_VERSION must match @opencode-ai/sdk $SDK_VERSION."
            exit 1
          fi
          echo "version=$OPENCODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up OpenCode
        if: steps.pull-request.outputs.eligible == 'true'
        id: setup-opencode
        uses: ./seqlane-source/actions/setup-opencode
        with:
          version: ${{ steps.opencode-version.outputs.version }}

      - name: Start OpenCode
        if: steps.pull-request.outputs.eligible == 'true'
        id: opencode
        timeout-minutes: 2
        uses: ./seqlane-source/actions/opencode-server
        with:
          working-directory: ${{ github.workspace }}/review-target
          executable: ${{ steps.setup-opencode.outputs.executable }}
          hostname: 127.0.0.1
          port: "4096"
          startup-timeout-seconds: "30"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_CONFIG_CONTENT: >-
            {"model":"openai/gpt-5.6-luna","mcp":{"zvec_grep":{"type":"remote","url":"${{ steps.zvec-grep.outputs.mcp-url }}","enabled":true,"oauth":false,"timeout":10000},"ripwire":{"type":"remote","url":"${{ steps.ripwire.outputs.mcp-url }}","headers":{"Authorization":"Bearer ${{ steps.ripwire.outputs.mcp-token }}"},"enabled":true,"oauth":false,"timeout":10000}},"permission":{"*":"deny","StructuredOutput":"allow","zvec_grep_zvec_grep_search":"allow","ripwire_analyze":"allow","ripwire_find_symbol":"allow","ripwire_find_referencing_symbols":"allow","ripwire_grep":"allow","ripwire_cochange":"allow","ripwire_memory_recall":"allow","ripwire_situational_awareness":"allow","ripwire_mentions":"allow","ripwire_for":"allow","ripwire_lego":"allow","ripwire_owners":"allow","ripwire_fetch_body":"allow","ripwire_batch":"allow","ripwire_exemplar":"allow","ripwire_quality_delta":"allow","ripwire_impact":"allow","ripwire_uses":"allow","ripwire_path_between":"allow","ripwire_connect":"allow","ripwire_explore":"allow","ripwire_from_trace":"allow","ripwire_edit_check":"allow","ripwire_whereis":"allow","ripwire_stray_content":"allow","ripwire_flags":"allow","ripwire_doc_drift":"allow","ripwire_slice":"allow","read":{"*":"allow","*.env":"deny","*.env.*":"deny","*.env.example":"allow"},"glob":"allow","grep":"allow","bash":"deny","external_directory":"deny"}}

      - name: Run Seqlane code review
        if: steps.pull-request.outputs.eligible == 'true'
        id: seqlane
        continue-on-error: true
        uses: ./seqlane-source/actions/code-review
        env:
          SEQLANE_REDACT_VALUES: |-
            ${{ secrets.OPENAI_API_KEY }}
            ${{ steps.ripwire.outputs.mcp-token }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pull-request-number: ${{ steps.pull-request.outputs.number }}
          review-target: ${{ github.workspace }}/review-target
          base-branch: ${{ steps.pull-request.outputs.base_branch }}
          base-revision: ${{ steps.pull-request.outputs.base_revision }}
          head-revision: ${{ steps.pull-request.outputs.head_revision }}
          runtime: ${{ steps.opencode.outputs.url }}

      - name: Fail when Seqlane execution fails
        if: steps.pull-request.outputs.eligible == 'true' && steps.seqlane.outcome != 'success'
        run: exit 1

  cancel-closed-review:
    name: Cancel review when pull request closes
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    permissions:
      contents: none
      issues: none
      pull-requests: none
    concurrency:
      group: seqlane-code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Confirm closed pull request cancellation
        run: echo "The closed pull request event canceled any active Seqlane review."
