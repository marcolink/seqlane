name: Seqlane code review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
  issue_comment:
    types:
      - created
      - edited
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: seqlane-code-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Review pull request
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action != 'closed' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/seqlane')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.pull_request_number != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Report workflow definition revision
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          echo "Workflow definition: $WORKFLOW_REF"
          echo "Workflow definition SHA: $WORKFLOW_SHA"
          {
            echo "### Workflow definition"
            echo
            echo "- Ref: \`$WORKFLOW_REF\`"
            echo "- SHA: \`$WORKFLOW_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check OpenAI credentials
        id: configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Seqlane code review because OPENAI_API_KEY is not configured."
          else
            echo "execute=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve pull request metadata
        if: steps.configuration.outputs.execute == 'true'
        id: pull-request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pull_request_number }}
          EVENT_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$EVENT_PR_NUMBER" \
              > "$RUNNER_TEMP/seqlane-pull-request.json"
            BASE_BRANCH=$(jq --raw-output '.base.ref' "$RUNNER_TEMP/seqlane-pull-request.json")
            BASE_REVISION=$(jq --raw-output '.base.sha' "$RUNNER_TEMP/seqlane-pull-request.json")
            HEAD_REVISION=$(jq --raw-output '.head.sha' "$RUNNER_TEMP/seqlane-pull-request.json")
            HEAD_REPOSITORY=$(jq --raw-output '.head.repo.full_name' "$RUNNER_TEMP/seqlane-pull-request.json")
            DRAFT=$(jq --raw-output '.draft' "$RUNNER_TEMP/seqlane-pull-request.json")
          else
            BASE_BRANCH="$EVENT_BASE_BRANCH"
            BASE_REVISION="$EVENT_BASE_REVISION"
            HEAD_REVISION="$EVENT_HEAD_REVISION"
            HEAD_REPOSITORY="$EVENT_HEAD_REPOSITORY"
            DRAFT="$EVENT_DRAFT"
          fi

          if [ "$EVENT_NAME" = "issue_comment" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            jq '{title: (.title // ""), description: (.body // "")}' \
              "$RUNNER_TEMP/seqlane-pull-request.json" \
              > "$RUNNER_TEMP/seqlane-pull-request-context.json"
          else
            jq '{title: (.pull_request.title // ""), description: (.pull_request.body // "")}' \
              "$GITHUB_EVENT_PATH" \
              > "$RUNNER_TEMP/seqlane-pull-request-context.json"
          fi

          if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ "$DRAFT" = "true" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "base_revision=$BASE_REVISION" >> "$GITHUB_OUTPUT"
          echo "head_revision=$HEAD_REVISION" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "source_revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "source_revision=$BASE_REVISION" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect pull request review context
        if: steps.pull-request.outputs.eligible == 'true'
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | @json' > "$RUNNER_TEMP/seqlane-issue-comments.ndjson"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | @json' > "$RUNNER_TEMP/seqlane-review-comments.ndjson"
          jq -s 'map(fromjson)' "$RUNNER_TEMP/seqlane-issue-comments.ndjson" \
            > "$RUNNER_TEMP/seqlane-issue-comments.json"
          jq -s 'map(fromjson)' "$RUNNER_TEMP/seqlane-review-comments.ndjson" \
            > "$RUNNER_TEMP/seqlane-review-comments.json"
          jq -n \
            --slurpfile issue "$RUNNER_TEMP/seqlane-issue-comments.json" \
            --slurpfile review "$RUNNER_TEMP/seqlane-review-comments.json" '
              def normalize($items; $kind):
                ($items[0] // []) | map(
                  {
                    id: (.id | tostring),
                    kind: $kind,
                    author: (.user.login // "unknown"),
                    authorAssociation: (.author_association // "NONE"),
                    body: ((.body // "")[:12000]),
                    createdAt: (.created_at // "")
                  }
                  + (if .updated_at then {updatedAt: .updated_at} else {} end)
                  + (if .html_url then {url: .html_url} else {} end)
                  + (if .path then {path: .path} else {} end)
                  + (if (.line | type) == "number" then {line: .line} else {} end)
                  + (if .commit_id then {commitId: .commit_id} else {} end)
                  + (if .in_reply_to_id then {inReplyTo: (.in_reply_to_id | tostring)} else {} end)
                );
              ([
                normalize($issue; "issue"),
                normalize($review; "review")
              ] | add | sort_by(.createdAt)) as $comments
              | {
                  comments: ($comments | .[-200:]),
                  truncated: (($comments | length) > 200)
                }
            ' > "$RUNNER_TEMP/seqlane-review-history.json"

      - name: Check out Seqlane source
        if: steps.pull-request.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: seqlane-source
          persist-credentials: false
          ref: ${{ steps.pull-request.outputs.source_revision }}

      - name: Check out pull request head
        if: steps.pull-request.outputs.eligible == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: review-target
          persist-credentials: false
          ref: ${{ steps.pull-request.outputs.head_revision }}

      - name: Set up pnpm
        if: steps.pull-request.outputs.eligible == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node.js
        if: steps.pull-request.outputs.eligible == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: seqlane-source/pnpm-lock.yaml

      - name: Install Seqlane dependencies
        if: steps.pull-request.outputs.eligible == 'true'
        working-directory: seqlane-source
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build the local Seqlane CLI
        if: steps.pull-request.outputs.eligible == 'true'
        working-directory: seqlane-source
        run: pnpm exec nx build seqlane-cli

      - name: Index pull request for semantic search
        if: steps.pull-request.outputs.eligible == 'true'
        working-directory: seqlane-source
        env:
          REVIEW_TARGET: ${{ github.workspace }}/review-target
          ZVEC_GREP_HOME: ${{ runner.temp }}/zvec-grep
          ZVEC_GREP_MODEL_CACHE: ${{ runner.temp }}/zvec-grep-model-cache
        run: |
          pnpm dlx @zvec/zvec-grep@0.2.1 index "$REVIEW_TARGET" \
            --mode direct \
            --embedding local/potion-code-16m-v2 \
            --hidden \
            --max-filesize 1M \
            --glob '*.ts' \
            --glob '*.tsx' \
            --glob '*.mts' \
            --glob '*.cts' \
            --glob '*.js' \
            --glob '*.jsx' \
            --glob '*.json' \
            --glob '*.yaml' \
            --glob '*.yml' \
            --glob '*.md' \
            --glob '*.css' \
            --glob '*.html' \
            --glob '*.sh' \
            --glob '.github/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/dist/**' \
            --glob '!**/build/**' \
            --glob '!**/coverage/**' \
            --glob '!**/.cache/**' \
            --glob '!**/.next/**' \
            --glob '!**/vendor/**' \
            --glob '!**/.env' \
            --glob '!**/.env.*' \
            --glob '!**/.envrc' \
            --glob '!**/.npmrc' \
            --glob '!**/id_*' \
            --glob '!**/*.pem' \
            --glob '!**/*.key' \
            --glob '!**/*.p12' \
            --glob '!**/*.pfx' \
            --glob '!**/secrets/**' \
            --glob '!**/private/**' \
            --glob '!**/credentials/**' \
            --glob '!**/*secret*.json' \
            --glob '!**/*credential*.json'

      - name: Start zvec-grep
        if: steps.pull-request.outputs.eligible == 'true'
        id: zvec-grep
        timeout-minutes: 2
        working-directory: seqlane-source
        env:
          ZVEC_GREP_HOME: ${{ runner.temp }}/zvec-grep
          ZVEC_GREP_MODEL_CACHE: ${{ runner.temp }}/zvec-grep-model-cache
        run: |
          pnpm dlx @zvec/zvec-grep@0.2.1 server run --listen 127.0.0.1:7999 \
            > "$RUNNER_TEMP/zvec-grep.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/zvec-grep.pid"
          echo "started=true" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 30); do
            if pnpm dlx @zvec/zvec-grep@0.2.1 server status --check-ready > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          echo "zvec-grep did not become ready. Detailed server logs are not printed to the public workflow log."
          exit 1

      - name: Install OpenCode
        if: steps.pull-request.outputs.eligible == 'true'
        working-directory: seqlane-source
        env:
          OPENCODE_VERSION: 1.18.27
        run: |
          SDK_VERSION=$(node -p "require('./libs/seqlane-opencode/package.json').dependencies['@opencode-ai/sdk']")
          if [ "$SDK_VERSION" != "$OPENCODE_VERSION" ]; then
            echo "::error::OpenCode CLI $OPENCODE_VERSION must match @opencode-ai/sdk $SDK_VERSION."
            exit 1
          fi
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"

      - name: Start OpenCode
        if: steps.pull-request.outputs.eligible == 'true'
        id: opencode
        timeout-minutes: 2
        working-directory: review-target
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_CONFIG_CONTENT: >-
            {"model":"openai/gpt-5.6-luna","mcp":{"zvec_grep":{"type":"remote","url":"http://127.0.0.1:7999/mcp","enabled":true,"oauth":false,"timeout":10000}},"permission":{"*":"deny","StructuredOutput":"allow","zvec_grep_zvec_grep_search":"allow","read":{"*":"allow","*.env":"deny","*.env.*":"deny","*.env.example":"allow"},"glob":"allow","grep":"allow","bash":"deny","external_directory":"deny"}}
        run: |
          opencode serve --hostname 127.0.0.1 --port 4096 --print-logs > "$RUNNER_TEMP/opencode.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/opencode.pid"
          echo "started=true" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 1 --max-time 2 \
              http://127.0.0.1:4096/global/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "OpenCode did not become ready. Detailed server logs are not printed to the public workflow log."
          exit 1

      - name: Run Seqlane code review
        if: steps.pull-request.outputs.eligible == 'true'
        id: seqlane
        continue-on-error: true
        working-directory: seqlane-source
        env:
          BASE_BRANCH: ${{ steps.pull-request.outputs.base_branch }}
          BASE_REVISION: ${{ steps.pull-request.outputs.base_revision }}
          HEAD_REVISION: ${{ steps.pull-request.outputs.head_revision }}
          REVIEW_TARGET: ${{ github.workspace }}/review-target
          REVIEW_HISTORY_PATH: ${{ runner.temp }}/seqlane-review-history.json
          SEQLANE_REDACT_VALUES: ${{ secrets.OPENAI_API_KEY }}
        run: |
          WORKFLOW_INPUT=$(jq --compact-output \
            --slurpfile reviewHistory "$REVIEW_HISTORY_PATH" \
            --slurpfile pullRequest "$RUNNER_TEMP/seqlane-pull-request-context.json" \
            --arg repository "$REVIEW_TARGET" \
            --arg baseBranch "$BASE_BRANCH" \
            --arg baseRevision "$BASE_REVISION" \
            --arg headRevision "$HEAD_REVISION" \
            '{
              repository: $repository,
              baseBranch: $baseBranch,
              baseRevision: $baseRevision,
              headRevision: $headRevision,
              reviewHistory: $reviewHistory[0],
              pullRequest: $pullRequest[0]
            }' "$GITHUB_EVENT_PATH")

          ./apps/seqlane-cli/bin/dev.js run "$PWD/examples/pr-code-review.ts" \
            --input "$WORKFLOW_INPUT" \
            --runtime http://127.0.0.1:4096 \
            --workspace "$REVIEW_TARGET" \
            --output ci \
            --record "$RUNNER_TEMP/seqlane-code-review-recording.jsonl"

      - name: Export code review events
        if: steps.pull-request.outputs.eligible == 'true' && steps.seqlane.outcome == 'success'
        working-directory: seqlane-source
        env:
          SEQLANE_REDACT_VALUES: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ./apps/seqlane-cli/bin/dev.js replay \
            "$RUNNER_TEMP/seqlane-code-review-recording.jsonl" \
            --output json \
            > "$RUNNER_TEMP/seqlane-code-review.jsonl"

          echo "Seqlane code review completed; publishing the report."

      - name: Publish code review
        if: steps.pull-request.outputs.eligible == 'true' && steps.seqlane.outcome == 'success'
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          jq --slurp \
            'map(select(.type == "run.succeeded")) | last | .output' \
            "$RUNNER_TEMP/seqlane-code-review.jsonl" \
            > "$RUNNER_TEMP/seqlane-code-review-result.json"

          jq --raw-output '
            [
              "<!-- seqlane-code-review -->",
              "<!-- seqlane-code-review-head: \(.headRevision) -->",
              ("<!-- seqlane-code-review-report-v1: " +
                ({
                  headRevision: .headRevision,
                  findings: .findings
                } | tojson | @base64) +
                " -->"),
              "## 🧪 Seqlane reviewer",
              "",
              "**Verdict:** \(if .verdict == "approve" then "✅ approve" else "🛑 request-changes" end) · **Rating:** ⭐ \(.overallRating)/5",
              "",
              .summary,
              "",
              "### Ratings",
              (.ratings[] |
                (if .rating >= 4 then "✅" elif .rating == 3 then "🟡" else "🔴" end) +
                " **\(.axis):** \(.rating)/5 — \(.rationale)"),
              "",
              "### Findings",
              (if (.findings | length) == 0 then
                "✅ No findings."
              else
                (.findings[] |
                  (if .disposition == "fixed" then "✅" elif .disposition == "wont-fix" then "⚪" elif .disposition == "downgraded" then "🟡" elif .severity == "critical" then "🚨" elif .severity == "required" then "🔴" elif .severity == "optional" then "🟡" else "💡" end) as $icon |
                  (if .severity == .effectiveSeverity then .severity else "\(.severity) → \(.effectiveSeverity)" end) as $severity |
                  " \($icon) **\(.id)** · **\($severity)** · **\(.axis)** — \(.summary)" +
                  (if .file then
                    " (`\(.file)\(if .line then ":\(.line)" else "" end)`)"
                  else "" end) +
                  "\n  - \(.recommendation)" +
                  (if .disposition != "open" then
                    "\n  - **Disposition:** \(.disposition)" +
                    (if .dispositionBy then " by @\(.dispositionBy)" else "" end) +
                    (if .dispositionReason then " — \(.dispositionReason)" else "" end)
                  else "" end))
              end),
              "",
              "### Verification",
              (if (.verification | length) == 0 then
                "⚠️ No verification evidence reported."
              else
                (.verification[] | "🔎 \(.)")
              end)
            ] | .[]
          ' "$RUNNER_TEMP/seqlane-code-review-result.json" \
            > "$RUNNER_TEMP/seqlane-code-review.md"

          cat "$RUNNER_TEMP/seqlane-code-review.md" >> "$GITHUB_STEP_SUMMARY"

          COMMENT_ID=$(gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- seqlane-code-review -->")) | .id' \
            | head -n 1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
              -F "body=@$RUNNER_TEMP/seqlane-code-review.md" > /dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F "body=@$RUNNER_TEMP/seqlane-code-review.md" > /dev/null
          fi

          echo "verdict=$(jq --raw-output '.verdict' "$RUNNER_TEMP/seqlane-code-review-result.json")" >> "$GITHUB_OUTPUT"

      - name: Stop OpenCode
        if: always() && steps.opencode.outputs.started == 'true'
        run: |
          kill "$(cat "$RUNNER_TEMP/opencode.pid")" 2> /dev/null || true
          wait "$(cat "$RUNNER_TEMP/opencode.pid")" 2> /dev/null || true

      - name: Stop zvec-grep
        if: always() && steps.zvec-grep.outputs.started == 'true'
        run: |
          kill "$(cat "$RUNNER_TEMP/zvec-grep.pid")" 2> /dev/null || true
          wait "$(cat "$RUNNER_TEMP/zvec-grep.pid")" 2> /dev/null || true

      - name: Fail when Seqlane execution fails
        if: steps.pull-request.outputs.eligible == 'true' && steps.seqlane.outcome != 'success'
        run: exit 1
