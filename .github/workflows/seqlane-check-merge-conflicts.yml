name: Check pull request merge conflicts

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

jobs:
  check:
    name: Check merge conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check mergeability
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mergeable=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.mergeable')
          if [ "$mergeable" = "false" ]; then
            {
              echo "### Merge conflicts detected"
              echo
              echo "A maintainer can run **Seqlane conflict resolver** from the Actions tab."
              echo "Choose the pull request number and an integration strategy; rebase is the default."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::This pull request has merge conflicts. Run Seqlane conflict resolver from the Actions tab."
            exit 1
          fi
          if [ "$mergeable" = "null" ]; then
            echo "::notice::GitHub is still calculating mergeability."
            exit 0
          fi
          echo "No merge conflicts detected." >> "$GITHUB_STEP_SUMMARY"
