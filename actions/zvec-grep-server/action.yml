name: zvec-grep server
description: Start a zvec-grep MCP server and stop it automatically after the job

inputs:
  working-directory:
    description: Directory in which zvec-grep runs
    required: true
  version:
    description: zvec-grep package version
    required: false
    default: "0.2.1"
  listen:
    description: zvec-grep listen address
    required: false
    default: 127.0.0.1:7999
  package-manager:
    description: Package manager used to invoke zvec-grep
    required: false
    default: pnpm
  home:
    description: zvec-grep home directory
    required: false
  model-cache:
    description: zvec-grep model cache directory
    required: false
  startup-timeout-seconds:
    description: Maximum time to wait for zvec-grep readiness
    required: false
    default: "30"

outputs:
  mcp-url:
    description: zvec-grep MCP endpoint
  log-path:
    description: zvec-grep server log path

runs:
  using: node24
  main: dist/main.js
  post: dist/post.js
  post-if: always()
