<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title description">
  <title id="title">A Seqlane workflow</title>
  <desc id="description">A workflow starts with a pull request, runs an agent task and a deterministic task in parallel, builds a plan, and produces a verified result.</desc>
  <style>
    .canvas { fill: #ffffff; stroke: #e4e4e7; }
    .edge { fill: none; stroke: #a1a1aa; stroke-width: 2.5; }
    .node { fill: #fafafa; stroke: #d4d4d8; stroke-width: 2; }
    .brand-node { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
    .result-node { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
    .node-title { fill: #18181b; font: 650 18px system-ui, sans-serif; }
    .node-detail { fill: #71717a; font: 14px system-ui, sans-serif; }
    .eyebrow { fill: #71717a; font: 600 13px system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
    .badge { fill: #ede9fe; stroke: #c4b5fd; stroke-width: 1.5; }
    .badge-text { fill: #6d28d9; font: 600 13px system-ui, sans-serif; }
    .icon { fill: #8b5cf6; }
    .check { fill: #059669; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #18181b; stroke: #3f3f46; }
      .edge { stroke: #71717a; }
      .node { fill: #27272a; stroke: #52525b; }
      .brand-node { fill: #2e2050; stroke: #a78bfa; }
      .result-node { fill: #12382f; stroke: #34d399; }
      .node-title { fill: #f4f4f5; }
      .node-detail, .eyebrow { fill: #a1a1aa; }
      .badge { fill: #312e81; stroke: #7c3aed; }
      .badge-text { fill: #ddd6fe; }
      .icon { fill: #a78bfa; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa" />
    </marker>
  </defs>

  <rect class="canvas" x="20" y="20" width="920" height="560" rx="28" />
  <text class="eyebrow" x="66" y="70">One workflow · safe parallelism</text>

  <g class="edge" marker-end="url(#arrow)">
    <path d="M480 166 V198 H240 V236" />
    <path d="M480 166 V198 H720 V236" />
    <path d="M240 326 V360 H480 V386" />
    <path d="M720 326 V360 H480 V386" />
    <path d="M480 476 V508" />
  </g>

  <rect class="badge" x="424" y="182" width="112" height="34" rx="17" />
  <text class="badge-text" x="480" y="204" text-anchor="middle">parallel</text>

  <g>
    <rect class="brand-node" x="360" y="98" width="240" height="68" rx="16" />
    <circle class="icon" cx="394" cy="132" r="10" />
    <text class="node-title" x="418" y="127">Pull request</text>
    <text class="node-detail" x="418" y="149">workflow input</text>
  </g>

  <g>
    <rect class="node" x="100" y="236" width="280" height="90" rx="16" />
    <path class="icon" d="M135 258h20v5h-20zm0 10h20v5h-20zm0 10h13v5h-13z" />
    <text class="node-title" x="170" y="269">Inspect changes</text>
    <text class="node-detail" x="170" y="295">agent task</text>
  </g>

  <g>
    <rect class="node" x="580" y="236" width="280" height="90" rx="16" />
    <path class="icon" d="M620 252l13 13-13 13-4-4 9-9-9-9z" />
    <text class="node-title" x="650" y="269">Check policy</text>
    <text class="node-detail" x="650" y="295">deterministic task</text>
  </g>

  <g>
    <rect class="brand-node" x="360" y="386" width="240" height="90" rx="16" />
    <path class="icon" d="M400 409h20v5h-20zm0 10h20v5h-20zm0 10h13v5h-13z" />
    <text class="node-title" x="438" y="421">Build plan</text>
    <text class="node-detail" x="438" y="447">validated task output</text>
  </g>

  <g>
    <rect class="result-node" x="360" y="508" width="240" height="50" rx="16" />
    <path class="check" d="M397 531l8 8 16-18 4 4-20 22-12-12z" />
    <text class="node-title" x="438" y="540">Verified result</text>
  </g>
</svg>
