packages:
  - "apps/*"
  - "actions/*"
  - "libs/*"
  - "workflows/*"

allowBuilds:
  {
    "@swc/core": set this to true or false,
    esbuild: set this to true or false,
    nx: set this to true or false,
    unrs-resolver: set this to true or false,
  }
autoInstallPeers: false
engineStrict: true
ignoreScripts: false
linkWorkspacePackages: true
lockfileIncludeTarballUrl: true
strictPeerDependencies: false

catalog:
  "@nx/esbuild": "22.7.1"
  "@nx/eslint": "22.7.1"
  "@nx/eslint-plugin": "22.7.1"
  "@nx/jest": "22.7.1"
  "@nx/js": "22.7.1"
  "@nx/node": "22.7.1"
  "@nx/vitest": "22.7.1"
  "@nx/workspace": "22.7.1"
  "@types/node": "24.13.2"
  eslint: "^9.39.5"
  eslint-config-prettier: "^10.1.8"
  esbuild: "0.28.2"
  jsonc-eslint-parser: "^2.4.2"
  nx: "22.7.1"
  prettier: "^3.9.6"
  tslib: "^2.8.1"
  typescript-eslint: "^8.66.0"
  vite: "^8.2.1"
  vitest: "4.1.10"
